<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="9" md="10" xl="8">
        <c-card class="mx-4">
          <c-card-body class="p-4">
            <form cForm>
              <h1>Nuevo Usuario</h1>
              <p class="text-body-secondary">
                 Crea una cuenta de acceso al panel. El rol define qué opciones podrá usar.
              </p>

              <div class="alert alert-danger py-2" *ngIf="errorMsg">{{ errorMsg }}</div>
              <div class="alert alert-success py-2" *ngIf="successMsg">{{ successMsg }}</div>

              <c-row>
                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilUser"></svg></span>
                    <input cFormControl placeholder="Primer nombre" [(ngModel)]="form.nombre1" name="nombre1" />
                  </c-input-group>
                </c-col>
                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilUser"></svg></span>
                    <input cFormControl placeholder="Segundo nombre" [(ngModel)]="form.nombre2" name="nombre2" />
                  </c-input-group>
                </c-col>
                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilUser"></svg></span>
                    <input cFormControl placeholder="Primer apellido" [(ngModel)]="form.apellido1" name="apellido1" />
                  </c-input-group>
                </c-col>
                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilUser"></svg></span>
                    <input cFormControl placeholder="Segundo apellido" [(ngModel)]="form.apellido2" name="apellido2" />
                  </c-input-group>
                </c-col>
                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilDescription"></svg></span>
                    <input cFormControl placeholder="Cédula" [(ngModel)]="form.cedula" name="cedula" />
                  </c-input-group>
                </c-col>
                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilCalendar"></svg></span>
                          <input cFormControl type="date" [(ngModel)]="form.fecha_nacimiento" name="fecha_nacimiento" [min]="fechaMin" [max]="fechaMax" />
                  </c-input-group>
                </c-col>

                <c-col md="6">
                  <select class="form-select mb-3" [(ngModel)]="form.cargo_id" name="cargo_id">
                    <option [ngValue]="null">Selecciona un cargo</option>
                    <option *ngFor="let c of cargos" [ngValue]="c.crg_id">{{ c.crg_descr }}</option>
                  </select>
                </c-col>
                <c-col md="6">
                  <select class="form-select mb-3" [(ngModel)]="form.rol_id" name="rol_id">
                    <option [ngValue]="null">Selecciona un rol</option>
                    <option *ngFor="let r of roles" [ngValue]="r.rol_id">{{ r.rol_descri }}</option>
                  </select>
                </c-col>
                <c-col md="12" class="mb-3">
                  <label class="form-label">Sucursales asignadas <span class="text-danger">*</span></label>
                  <div class="border rounded p-2">
                    <div class="form-check" *ngFor="let s of sucursales">
                      <input class="form-check-input" type="checkbox"
                             [id]="'suc-' + s.suc_id" [name]="'suc-' + s.suc_id"
                             [checked]="estaSeleccionada(s.suc_id)"
                             (change)="alternarSucursal(s.suc_id, $any($event.target).checked)" />
                      <label class="form-check-label" [for]="'suc-' + s.suc_id">{{ s.suc_nombre }}</label>
                    </div>
                    <div class="text-muted small" *ngIf="sucursales.length === 0">
                      No hay sucursales activas. Créalas primero en Configuración &gt; Empresa &gt; Sucursales.
                    </div>
                  </div>
                </c-col>

                <c-col md="12" class="mb-3" *ngIf="sucursalesSel.length > 1">
                  <label class="form-label">Sucursal principal</label>
                  <select class="form-select" [(ngModel)]="sucursalPrincipal" name="sucursal_principal">
                    <option *ngFor="let s of sucursalesSeleccionadas" [ngValue]="s.suc_id">{{ s.suc_nombre }}</option>
                  </select>
                </c-col>
                <c-col md="12">
                  <c-input-group class="mb-3">
                    <span cInputGroupText>&#64;</span>
                    <input autoComplete="email" cFormControl placeholder="Email" [(ngModel)]="form.email" name="email" />
                  </c-input-group>
                </c-col>

                <c-col md="6">
                  <c-input-group class="mb-3">
                    <span cInputGroupText><svg cIcon name="cilLockLocked"></svg></span>
                    <input autoComplete="new-password" cFormControl placeholder="Contraseña" type="password" [(ngModel)]="form.password" name="password" />
                  </c-input-group>
                </c-col>
                <c-col md="6">
                  <c-input-group class="mb-4">
                    <span cInputGroupText><svg cIcon name="cilLockLocked"></svg></span>
                    <input autoComplete="new-password" cFormControl placeholder="Repetir contraseña" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" />
                  </c-input-group>
                </c-col>
              </c-row>

              <div class="d-grid">
                <button cButton color="success" type="button" [disabled]="loading" (click)="register()">
                  {{ loading ? 'Creando...' : 'Crear cuenta' }}
                </button>
              </div>
              <div class="text-center mt-3">
                <a cButton color="link" routerLink="/usuarios/list">Volver a Usuarios</a>
              </div>
            </form>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
