<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col md="8" lg="6" xl="5">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form *ngIf="!exito" cForm [formGroup]="form" (ngSubmit)="onSubmit()">
                <h1>Nueva contraseña</h1>
                <p class="text-body-secondary">
                  Ingresa el código de 6 dígitos que te enviamos por correo y elige tu nueva contraseña.
                </p>
                <div *ngIf="errorMsg" class="alert alert-danger py-2">
                  {{ errorMsg }}
                </div>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    cFormControl
                    formControlName="code"
                    placeholder="Código de 6 dígitos"
                    autocomplete="one-time-code"
                  />
                </c-input-group>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    cFormControl
                    type="password"
                    formControlName="new_password"
                    placeholder="Nueva contraseña"
                    autocomplete="new-password"
                  />
                </c-input-group>
                <div
                  *ngIf="form.get('new_password')?.invalid && form.get('new_password')?.touched"
                  class="text-danger small mb-3"
                >
                  Debe tener al menos 8 caracteres
                </div>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    cFormControl
                    type="password"
                    formControlName="confirm_password"
                    placeholder="Confirmar contraseña"
                    autocomplete="new-password"
                  />
                </c-input-group>
                <div
                  *ngIf="form.errors?.['passwordsNoCoinciden'] && form.get('confirm_password')?.touched"
                  class="text-danger small mb-3"
                >
                  Las contraseñas no coinciden
                </div>

                <c-row>
                  <c-col xs="7">
                    <button cButton [disabled]="loading" class="px-4" color="primary" type="submit">
                      {{ loading ? 'Guardando...' : 'Cambiar contraseña' }}
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="5">
                    <button cButton class="px-0" color="link" routerLink="/login">
                      Volver a login
                    </button>
                  </c-col>
                </c-row>
              </form>

              <div *ngIf="exito">
                <h1>¡Listo!</h1>
                <p class="text-body-secondary">
                  Tu contraseña fue actualizada. Ya puedes iniciar sesión con ella.
                </p>
                <button cButton class="px-4" color="primary" (click)="irALogin()">
                  Ir a login
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
