<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col md="8" lg="6" xl="5">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form *ngIf="!enviado" cForm [formGroup]="form" (ngSubmit)="onSubmit()">
                <h1>¿Olvidaste tu contraseña?</h1>
                <p class="text-body-secondary">
                  Ingresa tu email y te enviaremos un código para restablecerla.
                </p>
                <div *ngIf="errorMsg" class="alert alert-danger py-2">
                  {{ errorMsg }}
                </div>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input
                    cFormControl
                    formControlName="email"
                    placeholder="Email"
                    autocomplete="username"
                  />
                </c-input-group>
                <div
                  *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
                  class="text-danger small mb-3"
                >
                  Ingresa un email válido
                </div>
                <c-row>
                  <c-col xs="7">
                    <button cButton [disabled]="loading" class="px-4" color="primary" type="submit">
                      {{ loading ? 'Enviando...' : 'Enviar código' }}
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="5">
                    <button cButton class="px-0" color="link" routerLink="/login">
                      Volver a login
                    </button>
                  </c-col>
                </c-row>
              </form>

              <div *ngIf="enviado">
                <h1>Revisa tu correo</h1>
                <p class="text-body-secondary">
                  Si el email existe en nuestro sistema, te enviamos un código de 6 dígitos.
                  Úsalo en la siguiente pantalla para elegir una nueva contraseña.
                </p>
                <button cButton class="px-4" color="primary" (click)="irAResetPassword()">
                  Ya tengo el código
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
