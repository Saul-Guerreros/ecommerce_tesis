<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form  cForm [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <div *ngIf="errorMsg" class="alert alert-danger py-2">
                  {{ errorMsg }}
                </div>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input  cFormControl
                    formControlName="email"
                    placeholder="Email"
                    autocomplete="username"/>
                </c-input-group>
                 <div
                  *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                  class="text-danger small mb-3"
                >
                  Ingresa un email válido
                </div>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    cFormControl
                    type="password"
                    formControlName="password"
                    placeholder="Password"
                    autocomplete="current-password"
                  />
                </c-input-group>
                 <div
                  *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                  class="text-danger small mb-3"
                >
                  La contraseña es requerida
                </div>
                <c-row>
                  <c-col xs="6">
                    <button  cButton [disabled]="loading" class="px-4" color="primary" type="submit">
                      {{ loading ? 'Ingresando...' : 'Login' }}
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="6">
                    <button cButton class="px-0" color="link" routerLink="/forgot-password">
                      Forgot password?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>Acceso restringido</h2>
                <p>
                  Este panel es solo para personal autorizado (Administradores y Vendedores).
                  Las cuentas de acceso las crea un Administrador desde el módulo de Usuarios;
                  no hay auto-registro aquí.
                </p>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
