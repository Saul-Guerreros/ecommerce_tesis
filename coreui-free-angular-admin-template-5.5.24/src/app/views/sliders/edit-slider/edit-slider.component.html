<c-card>
  <c-card-header>
    <strong>Editar Slider</strong>
    <span class="spinner-border spinner-border-sm ms-2" *ngIf="isLoading$ | async"></span>
  </c-card-header>

  <c-card-body>
    <div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>
    <div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>

    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Producto (*)</label>
          <div class="input-group mb-1">
            <input
              type="text"
              class="form-control"
              placeholder="Buscar producto por título..."
              [(ngModel)]="productoSearch"
              [ngModelOptions]="{ standalone: true }"
              (keyup.enter)="loadProductos()"
            />
            <button cButton type="button" color="secondary" variant="outline" (click)="loadProductos()">
              Buscar
            </button>
          </div>
          <select class="form-select" formControlName="sld_prdid">
            <option *ngFor="let p of productos" [value]="p.prd_id">
              {{ p.prd_titulo }} (#{{ p.prd_id }})
            </option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Título (*)</label>
          <input type="text" class="form-control" formControlName="sld_titulo" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Subtítulo</label>
          <input type="text" class="form-control" formControlName="sld_subtitulo" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Label</label>
          <input type="text" class="form-control" formControlName="sld_label" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Enlace</label>
          <input type="text" class="form-control" formControlName="sld_enlace" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Orden</label>
          <input type="number" class="form-control" formControlName="sld_orden" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <select class="form-select" formControlName="sld_tipo">
            <option [value]="1">Banner principal</option>
            <option [value]="2">Banner secundario</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Imagen</label>
          <input type="file" class="form-control" accept=".jpeg,.jpg,.png,.gif,.webp" (change)="onFile($event)" />
          <img *ngIf="preview" [src]="preview" width="200" class="mt-2 rounded" alt="preview" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Estado (*)</label>
          <select class="form-select" formControlName="sld_estado">
            <option [value]="1">Activo</option>
            <option [value]="2">Inactivo</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Color</label>
          <input type="color" class="form-control form-control-color" formControlName="sld_color" />
        </div>
      </div>

      <button cButton color="primary" type="submit">Actualizar</button>
      <a routerLink="/sliders/list" cButton color="secondary" variant="outline" class="ms-2">Volver</a>
    </form>
  </c-card-body>
</c-card>
