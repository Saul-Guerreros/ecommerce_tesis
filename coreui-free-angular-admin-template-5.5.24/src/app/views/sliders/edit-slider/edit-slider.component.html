<c-card>
  <c-card-header>
    <strong>Editar Slider</strong>
    <span class="spinner-border spinner-border-sm ms-2" *ngIf="isLoading$ | async"></span>
  </c-card-header>

  <c-card-body>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="sld_titulo" maxlength="150" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Subtítulo</label>
          <input type="text" class="form-control" formControlName="sld_subtitulo" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Label</label>
          <input type="text" class="form-control" formControlName="sld_label" placeholder="Ej: Oferta -20%" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Tipo</label>
          <select class="form-select" formControlName="sld_tipo">
            <option [ngValue]="1">Banner principal</option>
            <option [ngValue]="2">Banner secundario</option>
            <option [ngValue]="3">Banner terciario</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Orden</label>
          <input type="number" class="form-control" formControlName="sld_orden" />
        </div>
        <div class="col-md-2" *ngIf="form.value.sld_tipo == 2">
          <label class="form-label fw-semibold">Posición <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="sld_posicion">
            <option [ngValue]="null" disabled>Lado...</option>
            <option [ngValue]="1">Izquierda</option>
            <option [ngValue]="2">Derecha</option>
          </select>
        </div>
      </div>

      <hr class="my-4" />

      <div class="mb-4" *ngIf="cargado">
        <app-destino-slider [form]="form"></app-destino-slider>
      </div>

      <hr class="my-4" />

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Imagen</label>
          <input type="file" class="form-control" accept=".jpeg,.jpg,.png,.gif,.webp" (change)="onFile($event)" />
          <div class="form-text">Deja vacío para conservar la imagen actual.</div>
          <img *ngIf="preview" [src]="preview" width="200" class="mt-2 rounded border" alt="preview" />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Estado</label>
          <select class="form-select" formControlName="sld_estado">
            <option [ngValue]="1">Activo</option>
            <option [ngValue]="2">Inactivo</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Color</label>
          <input type="color" class="form-control form-control-color" formControlName="sld_color" />
        </div>
      </div>

      <div class="d-flex gap-2 border-top pt-3">
        <button cButton color="primary" type="submit" [disabled]="guardando">
          <span class="spinner-border spinner-border-sm me-1" *ngIf="guardando"></span>
          {{ guardando ? 'Guardando...' : 'Actualizar' }}
        </button>
        <a routerLink="/sliders/list" cButton color="secondary">Cancelar</a>
      </div>
    </form>
  </c-card-body>
</c-card>
