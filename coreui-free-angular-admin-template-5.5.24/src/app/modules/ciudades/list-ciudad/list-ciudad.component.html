<c-card class="mb-4">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Ciudades</strong>
    <button cButton color="primary" (click)="abrirNuevo()">+ Nueva ciudad</button>
  </c-card-header>

  <c-card-body>
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <input cFormControl placeholder="Buscar ciudad..."
               [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
      </div>

      <div class="col-md-3">
        <select cSelect [(ngModel)]="filtroDepartamento" (ngModelChange)="cargar()">
          <option [ngValue]="null">Todos los departamentos</option>
          <option *ngFor="let d of departamentos" [ngValue]="d.dep_id">{{ d.dep_descri }}</option>
        </select>
      </div>

      <div class="col-md-3">
        <select cSelect [(ngModel)]="filtroEstado" (ngModelChange)="cargar()">
          <option value="">Todos los estados</option>
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>

      <div class="col-md-2">
        <button cButton color="secondary" variant="outline" class="w-100" (click)="limpiarFiltros()">
          Limpiar
        </button>
      </div>
    </div>

    <div class="text-muted small mb-2" *ngIf="!cargando">
      {{ ciudades.length }} ciudad(es) encontrada(s)
    </div>

    <div class="text-center py-4" *ngIf="cargando">
      <c-spinner color="primary"></c-spinner>
    </div>

    <table cTable striped hover *ngIf="!cargando">
      <thead>
        <tr>
          <th>#</th>
          <th>Ciudad</th>
          <th>Departamento</th>
          <th class="text-center">En uso</th>
          <th class="text-center">Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of ciudades">
          <td>{{ c.ciu_id }}</td>
          <td>{{ c.ciu_descri }}</td>
          <td>{{ c.dep_descri }}</td>
          <td class="text-center">{{ c.usos_count }}</td>
          <td class="text-center">
            <c-badge [color]="c.ciu_estado === 1 ? 'success' : 'secondary'">
              {{ c.ciu_estado === 1 ? 'Activo' : 'Inactivo' }}
            </c-badge>
          </td>
          <td class="text-end">
            <button cButton size="sm" color="info" class="me-2 text-white" (click)="abrirEditar(c)">Editar</button>
            <button cButton size="sm" [color]="c.ciu_estado === 1 ? 'warning' : 'success'"
                    class="me-2 text-white" (click)="cambiarEstado(c)">
              {{ c.ciu_estado === 1 ? 'Desactivar' : 'Activar' }}
            </button>
            <button cButton size="sm" color="danger" class="text-white" (click)="abrirEliminar(c)">Eliminar</button>
          </td>
        </tr>

        <tr *ngIf="ciudades.length === 0">
          <td colspan="6" class="text-center">No hay ciudades registradas</td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>

<app-form-ciudad
  [visible]="formModalVisible"
  [ciudad]="ciudadSeleccionada"
  (visibleChange)="formModalVisible = $event"
  (guardado)="cargar()">
</app-form-ciudad>

<app-delete-ciudad
  [visible]="deleteModalVisible"
  [ciudad]="ciudadSeleccionada"
  (visibleChange)="deleteModalVisible = $event"
  (confirmar)="confirmarEliminar()">
</app-delete-ciudad>
