<c-card>
  <c-card-header>
    <strong>Nueva marca</strong>
  </c-card-header>
  <c-card-body>
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="mb-3">
        <label cLabel for="mar_descri">Descripción</label>
        <input cFormControl id="mar_descri" formControlName="mar_descri" placeholder="Ej: Samsung" />
        <div class="text-danger small" *ngIf="form.get('mar_descri')?.touched && form.get('mar_descri')?.invalid">
          La descripción es obligatoria (máx. 50 caracteres)
        </div>
      </div>

      <button cButton color="secondary" type="button" class="me-2" (click)="cancelar()">Cancelar</button>
      <button cButton color="primary" type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
    </form>
  </c-card-body>
</c-card>
