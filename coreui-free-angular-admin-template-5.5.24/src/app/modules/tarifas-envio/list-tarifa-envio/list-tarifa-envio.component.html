<c-card class="mb-4">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Tarifas de Envío</strong>
    <button cButton color="primary" (click)="abrirNuevo()">+ Nueva tarifa</button>
  </c-card-header>

  <c-card-body>
    <div class="text-muted small mb-2" *ngIf="!cargando">
      {{ tarifas.length }} tarifa(s) encontrada(s)
    </div>

    <div class="text-center py-4" *ngIf="cargando">
      <c-spinner color="primary"></c-spinner>
    </div>

    <table cTable striped hover *ngIf="!cargando">
      <thead>
        <tr>
          <th>#</th>
          <th>Sucursal</th>
          <th>Ciudad</th>
          <th class="text-end">Costo (Gs.)</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of tarifas">
          <td>{{ t.tev_id }}</td>
          <td>{{ t.sucursal }}</td>
          <td>{{ t.ciudad }}</td>
          <td class="text-end">{{ t.tev_costo | number:'1.0-2' }}</td>
          <td class="text-end">
            <button cButton size="sm" color="info" class="me-2 text-white" (click)="abrirEditar(t)">Editar</button>
            <button cButton size="sm" color="danger" class="text-white" (click)="abrirEliminar(t)">Eliminar</button>
          </td>
        </tr>

        <tr *ngIf="tarifas.length === 0">
          <td colspan="5" class="text-center">No hay tarifas registradas</td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>

<app-form-tarifa-envio
  [visible]="formModalVisible"
  [tarifa]="tarifaSeleccionada"
  (visibleChange)="formModalVisible = $event"
  (guardado)="cargar()">
</app-form-tarifa-envio>

<app-delete-tarifa-envio
  [visible]="deleteModalVisible"
  [tarifa]="tarifaSeleccionada"
  (visibleChange)="deleteModalVisible = $event"
  (confirmar)="confirmarEliminar()">
</app-delete-tarifa-envio>
