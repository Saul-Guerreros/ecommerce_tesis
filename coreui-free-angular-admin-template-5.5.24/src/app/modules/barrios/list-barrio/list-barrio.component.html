<c-card class="mb-4">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Barrios</strong>
    <button cButton color="primary" (click)="abrirNuevo()">+ Nuevo barrio</button>
  </c-card-header>

  <c-card-body>
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <input cFormControl placeholder="Buscar barrio..."
               [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
      </div>

      <div class="col-md-3">
        <select cSelect [(ngModel)]="filtroCiudad" (ngModelChange)="cargar()">
          <option [ngValue]="null">Todas las ciudades</option>
          <option *ngFor="let c of ciudades" [ngValue]="c.ciu_id">{{ c.ciu_descri }}</option>
        </select>
      </div>

      <div class="col-md-3">
        <select cSelect [(ngModel)]="filtroEstado" (ngModelChange)="cargar()">
          <option value="">Todos los estados</option>
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>

      <div class="col-md-2">
        <button cButton color="secondary" variant="outline" class="w-100" (click)="limpiarFiltros()">
          Limpiar
        </button>
      </div>
    </div>

    <div class="text-muted small mb-2" *ngIf="!cargando">
      {{ barrios.length }} barrio(s) encontrado(s)
    </div>

    <div class="text-center py-4" *ngIf="cargando">
      <c-spinner color="primary"></c-spinner>
    </div>

    <table cTable striped hover *ngIf="!cargando">
      <thead>
        <tr>
          <th>#</th>
          <th>Barrio</th>
          <th>Ciudad</th>
          <th>Departamento</th>
          <th class="text-center">En uso</th>
          <th class="text-center">Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of barrios">
          <td>{{ b.bar_id }}</td>
          <td>{{ b.bar_descri }}</td>
          <td>{{ b.ciu_descri }}</td>
          <td>{{ b.dep_descri }}</td>
          <td class="text-center">{{ b.usos_count }}</td>
          <td class="text-center">
            <c-badge [color]="b.bar_estado === 1 ? 'success' : 'secondary'">
              {{ b.bar_estado === 1 ? 'Activo' : 'Inactivo' }}
            </c-badge>
          </td>
          <td class="text-end">
            <button cButton size="sm" color="info" class="me-2 text-white" (click)="abrirEditar(b)">Editar</button>
            <button cButton size="sm" [color]="b.bar_estado === 1 ? 'warning' : 'success'"
                    class="me-2 text-white" (click)="cambiarEstado(b)">
              {{ b.bar_estado === 1 ? 'Desactivar' : 'Activar' }}
            </button>
            <button cButton size="sm" color="danger" class="text-white" (click)="abrirEliminar(b)">Eliminar</button>
          </td>
        </tr>

        <tr *ngIf="barrios.length === 0">
          <td colspan="7" class="text-center">No hay barrios registrados</td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>

<app-form-barrio
  [visible]="formModalVisible"
  [barrio]="barrioSeleccionado"
  (visibleChange)="formModalVisible = $event"
  (guardado)="cargar()">
</app-form-barrio>

<app-delete-barrio
  [visible]="deleteModalVisible"
  [barrio]="barrioSeleccionado"
  (visibleChange)="deleteModalVisible = $event"
  (confirmar)="confirmarEliminar()">
</app-delete-barrio>
