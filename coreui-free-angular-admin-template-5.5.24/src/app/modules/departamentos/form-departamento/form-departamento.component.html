<c-modal [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)" backdrop="static">
  <c-modal-header>
    <h5 cModalTitle>{{ esEdicion ? 'Editar departamento' : 'Nuevo departamento' }}</h5>
  </c-modal-header>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <c-modal-body>
      <div class="row g-3">

        <div class="col-12">
          <label cLabel for="dep_descri">Nombre del departamento <span class="text-danger">*</span></label>
          <input cFormControl id="dep_descri" formControlName="dep_descri"
                 placeholder="Ej: Central" maxlength="50" />
          <div class="text-danger small" *ngIf="campoInvalido('dep_descri')">
            {{ errorBackend('dep_descri') || 'El nombre es obligatorio (máx. 50 caracteres).' }}
          </div>
        </div>

        <div class="col-12">
          <label cLabel for="dep_estado">Estado</label>
          <select cSelect id="dep_estado" formControlName="dep_estado">
            <option [ngValue]="1">Activo</option>
            <option [ngValue]="0">Inactivo</option>
          </select>
        </div>

      </div>
    </c-modal-body>

    <c-modal-footer>
      <button cButton color="secondary" type="button" (click)="cerrar()" [disabled]="guardando">Cancelar</button>
      <button cButton color="primary" type="submit" [disabled]="guardando">
        <c-spinner size="sm" *ngIf="guardando" class="me-2"></c-spinner>
        {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Registrar') }}
      </button>
    </c-modal-footer>
  </form>
</c-modal>
