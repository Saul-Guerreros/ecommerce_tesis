<c-modal [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)">
  <c-modal-header><h5 cModalTitle>Confirmar eliminación</h5></c-modal-header>
  <c-modal-body>
    <p *ngIf="!enUso">
      ¿Está seguro de eliminar el producto <strong>{{ producto?.prd_descri }}</strong>
      ({{ producto?.prd_codinv }})? Esta acción no se puede deshacer.
    </p>
    <div class="alert alert-warning mb-0" *ngIf="enUso">
      El producto <strong>{{ producto?.prd_descri }}</strong> está en uso y no puede eliminarse.
      Utilice el botón <strong>Desactivar</strong>.
    </div>
  </c-modal-body>
  <c-modal-footer>
    <button cButton color="secondary" (click)="cerrar()">Cancelar</button>
    <button cButton color="danger" class="text-white" *ngIf="!enUso" (click)="confirmar.emit()">Eliminar</button>
  </c-modal-footer>
</c-modal>
