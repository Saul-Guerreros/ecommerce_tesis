<c-modal [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)">
  <c-modal-header><h5 cModalTitle>Confirmar eliminación</h5></c-modal-header>
  <c-modal-body>
    <p *ngIf="!esProtegido && !enUso">
      ¿Está seguro de eliminar el rol <strong>{{ rol?.rol_descri }}</strong>?
    </p>
    <div class="alert alert-warning mb-0" *ngIf="esProtegido">
      El rol <strong>{{ rol?.rol_descri }}</strong> es utilizado internamente por el sistema y no puede eliminarse.
    </div>
    <div class="alert alert-warning mb-0" *ngIf="!esProtegido && enUso">
      Está asignado a {{ rol?.usuarios_count }} usuario(s) y no puede eliminarse.
      Utilice el botón <strong>Desactivar</strong>.
    </div>
  </c-modal-body>
  <c-modal-footer>
    <button cButton color="secondary" (click)="cerrar()">Cancelar</button>
    <button cButton color="danger" class="text-white" *ngIf="!esProtegido && !enUso" (click)="confirmar.emit()">
      Eliminar
    </button>
  </c-modal-footer>
</c-modal>
