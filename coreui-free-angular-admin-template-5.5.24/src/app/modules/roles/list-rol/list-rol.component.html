<c-card class="mb-4">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Roles</strong>
    <button cButton color="primary" (click)="abrirNuevo()">+ Nuevo rol</button>
  </c-card-header>

  <c-card-body>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <input cFormControl placeholder="Buscar..." [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
      </div>
      <div class="col-md-3">
        <select cSelect [(ngModel)]="filtroEstado" (ngModelChange)="cargar()">
          <option value="">Todos los estados</option>
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>
      <div class="col-md-3">
        <button cButton color="secondary" variant="outline" class="w-100" (click)="limpiarFiltros()">Limpiar</button>
      </div>
    </div>

    <div class="text-muted small mb-2" *ngIf="!cargando">{{ roles.length }} rol(es) encontrado(s)</div>
    <div class="text-center py-4" *ngIf="cargando"><c-spinner color="primary"></c-spinner></div>

    <table cTable striped hover *ngIf="!cargando">
      <thead>
        <tr><th>#</th><th>Nombre</th><th class="text-center">Usuarios</th><th class="text-center">Estado</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of roles">
          <td>{{ r.rol_id }}</td>
          <td>{{ r.rol_descri }}</td>
          <td class="text-center">{{ r.usuarios_count }}</td>
          <td class="text-center">
            <c-badge [color]="r.rol_estado === 1 ? 'success' : 'secondary'">{{ r.rol_estado === 1 ? 'Activo' : 'Inactivo' }}</c-badge>
          </td>
          <td class="text-end">
            <button cButton size="sm" color="info" class="me-2 text-white" (click)="abrirEditar(r)">Editar</button>
            <button cButton size="sm" [color]="r.rol_estado === 1 ? 'warning' : 'success'" class="me-2 text-white" (click)="cambiarEstado(r)">
              {{ r.rol_estado === 1 ? 'Desactivar' : 'Activar' }}
            </button>
            <button cButton size="sm" color="danger" class="text-white" (click)="abrirEliminar(r)">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="roles.length === 0"><td colspan="5" class="text-center">No hay roles registrados</td></tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>

<app-form-rol [visible]="formModalVisible" [rol]="rolSeleccionado"
  (visibleChange)="formModalVisible = $event" (guardado)="cargar()"></app-form-rol>

<app-delete-rol [visible]="deleteModalVisible" [rol]="rolSeleccionado"
  (visibleChange)="deleteModalVisible = $event" (confirmar)="confirmarEliminar()"></app-delete-rol>
