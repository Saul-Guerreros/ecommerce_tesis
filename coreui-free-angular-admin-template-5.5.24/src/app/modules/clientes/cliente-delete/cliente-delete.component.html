<c-modal [visible]="visible" (visibleChange)="!$event && cerrar()" size="sm">

  <c-modal-header>
    <h5 cModalTitle>Eliminar Cliente</h5>
  </c-modal-header>

  <c-modal-body>
    <p class="mb-1">¿Confirma la eliminación del siguiente cliente?</p>
    <strong>{{ cliente?.persona?.nombre_completo }}</strong>
    <div class="text-medium-emphasis small">
      Documento: {{ cliente?.persona?.per_cedula }}
    </div>
    <c-alert color="warning" class="mt-3 py-2 small mb-0">
      Esta acción no se puede deshacer. Si el cliente tiene pedidos registrados,
      el sistema impedirá la eliminación.
    </c-alert>
  </c-modal-body>

  <c-modal-footer>
    <button cButton color="secondary" variant="outline"
            (click)="cerrar()" [disabled]="submitting">Cancelar</button>
    <button cButton color="danger" (click)="eliminar()" [disabled]="submitting">
      <c-spinner *ngIf="submitting" size="sm" class="me-1"></c-spinner>
      Eliminar
    </button>
  </c-modal-footer>

</c-modal>
