<c-card class="mb-4">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Calles</strong>
    <button cButton color="primary" (click)="abrirNuevo()">+ Nueva calle</button>
  </c-card-header>

  <c-card-body>
    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <input cFormControl placeholder="Buscar calle..."
               [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
      </div>

      <div class="col-md-3">
        <select cSelect [(ngModel)]="filtroCiudad" (ngModelChange)="onFiltroCiudadChange()">
          <option [ngValue]="null">Todas las ciudades</option>
          <option *ngFor="let c of ciudades" [ngValue]="c.ciu_id">{{ c.ciu_descri }}</option>
        </select>
      </div>

      <div class="col-md-2">
        <select cSelect [(ngModel)]="filtroBarrio" (ngModelChange)="cargar()" [disabled]="!filtroCiudad">
          <option [ngValue]="null">Todos los barrios</option>
          <option *ngFor="let b of barriosFiltrados" [ngValue]="b.bar_id">{{ b.bar_descri }}</option>
        </select>
      </div>

      <div class="col-md-2">
        <select cSelect [(ngModel)]="filtroEstado" (ngModelChange)="cargar()">
          <option value="">Todos los estados</option>
          <option value="1">Activo</option>
          <option value="0">Inactivo</option>
        </select>
      </div>

      <div class="col-md-2">
        <button cButton color="secondary" variant="outline" class="w-100" (click)="limpiarFiltros()">
          Limpiar
        </button>
      </div>
    </div>

    <div class="text-muted small mb-2" *ngIf="!cargando">
      {{ calles.length }} calle(s) encontrada(s)
    </div>

    <div class="text-center py-4" *ngIf="cargando">
      <c-spinner color="primary"></c-spinner>
    </div>

    <table cTable striped hover *ngIf="!cargando">
      <thead>
        <tr>
          <th>#</th>
          <th>Calle</th>
          <th>Barrio</th>
          <th>Ciudad</th>
          <th class="text-center">En uso</th>
          <th class="text-center">Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of calles">
          <td>{{ c.cal_id }}</td>
          <td>{{ c.cal_descri }}</td>
          <td>{{ c.bar_descri }}</td>
          <td>{{ c.ciu_descri }}</td>
          <td class="text-center">{{ c.usos_count }}</td>
          <td class="text-center">
            <c-badge [color]="c.cal_estado === 1 ? 'success' : 'secondary'">
              {{ c.cal_estado === 1 ? 'Activo' : 'Inactivo' }}
            </c-badge>
          </td>
          <td class="text-end">
            <button cButton size="sm" color="info" class="me-2 text-white" (click)="abrirEditar(c)">Editar</button>
            <button cButton size="sm" [color]="c.cal_estado === 1 ? 'warning' : 'success'"
                    class="me-2 text-white" (click)="cambiarEstado(c)">
              {{ c.cal_estado === 1 ? 'Desactivar' : 'Activar' }}
            </button>
            <button cButton size="sm" color="danger" class="text-white" (click)="abrirEliminar(c)">Eliminar</button>
          </td>
        </tr>

        <tr *ngIf="calles.length === 0">
          <td colspan="7" class="text-center">No hay calles registradas</td>
        </tr>
      </tbody>
    </table>
  </c-card-body>
</c-card>

<app-form-calle
  [visible]="formModalVisible"
  [calle]="calleSeleccionada"
  (visibleChange)="formModalVisible = $event"
  (guardado)="cargar()">
</app-form-calle>

<app-delete-calle
  [visible]="deleteModalVisible"
  [calle]="calleSeleccionada"
  (visibleChange)="deleteModalVisible = $event"
  (confirmar)="confirmarEliminar()">
</app-delete-calle>
