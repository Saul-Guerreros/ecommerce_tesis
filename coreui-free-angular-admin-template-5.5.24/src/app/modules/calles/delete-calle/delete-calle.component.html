<c-modal [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)">
  <c-modal-header>
    <h5 cModalTitle>Confirmar eliminacion</h5>
  </c-modal-header>

  <c-modal-body>
    <p *ngIf="!enUso">
      ¿Esta seguro de eliminar la calle <strong>{{ calle?.cal_descri }}</strong>
      del barrio {{ calle?.bar_descri }}? Esta accion no se puede deshacer.
    </p>

    <div class="alert alert-warning mb-0" *ngIf="enUso">
      La calle <strong>{{ calle?.cal_descri }}</strong> esta en uso ({{ detalleUsos }})
      y no puede eliminarse. Utilice el boton <strong>Desactivar</strong>.
    </div>
  </c-modal-body>

  <c-modal-footer>
    <button cButton color="secondary" (click)="cerrar()">Cancelar</button>
    <button cButton color="danger" class="text-white" *ngIf="!enUso" (click)="confirmar.emit()">
      Eliminar
    </button>
  </c-modal-footer>
</c-modal>
