 <main>
        <section class="uk-section uk-section-small">
          <div class="uk-container uk-container-xsmall">
            <div class="uk-text-center">
              <ul class="uk-breadcrumb uk-flex-center uk-margin-remove">
                <li><a href="index.html">Home</a></li>
                <li><span>Verify Code</span></li>
              </ul>
              <h1 class="uk-margin-small-top uk-margin-remove-bottom">Verify Code</h1>
            </div>
            <div class="uk-margin-medium-top">
              <div class="uk-card uk-card-default uk-card-small tm-ignore-container">
                <div class="uk-card-body">
                  <p class="uk-text-meta">Enter the verification code we sent to your email, then choose a new password.</p>
                  <form class="uk-form-stacked" action="#" method="post" novalidate="">
                    <div class="uk-grid-medium uk-child-width-1-1" uk-grid="">
                            <div><label><div class="uk-form-label">New Password</div><div class="uk-inline uk-width-1-1"><span class="uk-form-icon" uk-icon="icon: lock"></span><input
                              class="uk-input"
                              type="password"
                              id="code" 
                              [(ngModel)]="new_password"
                              placeholder="••••••••"
                              autocomplete="new-password"
                              required=""
                            /></div></label></div><div><label><div class="uk-form-label">Confirm New Password</div><div class="uk-inline uk-width-1-1"><span class="uk-form-icon" uk-icon="icon: lock"></span><input
                              class="uk-input"
                              type="password"
                              name="password_confirmation"
                              placeholder="••••••••"
                              autocomplete="new-password"
                              required=""
                            /></div></label></div><div><button class="uk-button uk-button-primary uk-width-1-1" (click)="verifiedNewPassword()" type="submit">Reset Password</button></div><div class="uk-text-center uk-text-meta">Didn't get a code? 
                        <a href="forgot-password.html">Resend code</a></div></div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
