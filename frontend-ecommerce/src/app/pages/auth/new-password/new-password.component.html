<form (ngSubmit)="verifiedNewPassword()" novalidate>
  <div class="tm-auth-campo">
    <label class="uk-form-label" for="new_password">Nueva contraseña *</label>
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon" uk-icon="icon: lock"></span>
      <input class="uk-input" id="new_password" type="password" name="new_password"
             [(ngModel)]="new_password" placeholder="••••••••" autocomplete="new-password" required />
    </div>
    <div class="tm-auth-ayuda">Mínimo 8 caracteres.</div>
  </div>

  <div class="tm-auth-campo">
    <label class="uk-form-label" for="confirmacion">Confirmar nueva contraseña *</label>
    <div class="uk-inline uk-width-1-1">
      <span class="uk-form-icon" uk-icon="icon: lock"></span>
      <input class="uk-input" id="confirmacion" type="password" name="confirmacion"
             [(ngModel)]="confirmacion" placeholder="••••••••" autocomplete="new-password" required />
    </div>
  </div>

  <button class="uk-button uk-button-primary uk-width-1-1" type="submit" [disabled]="procesando">
    {{ procesando ? 'Guardando…' : 'Cambiar contraseña' }}
  </button>
</form>
