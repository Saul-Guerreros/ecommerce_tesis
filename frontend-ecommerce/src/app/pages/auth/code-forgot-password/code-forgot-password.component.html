<form (ngSubmit)="verifiedCode()" novalidate>
  <div class="tm-auth-campo">
    <label class="uk-form-label" for="codigo">Código de verificación *</label>
    <input class="uk-input tm-auth-codigo" id="codigo" type="text" name="codigo"
           [(ngModel)]="code" autocomplete="one-time-code" required />
    <div class="tm-auth-ayuda">Si no lo ves, revisá la carpeta de spam o correo no deseado.</div>
  </div>

  <button class="uk-button uk-button-primary uk-width-1-1" type="submit" [disabled]="procesando">
    {{ procesando ? 'Verificando…' : 'Verificar código' }}
  </button>

  <div class="tm-auth-pie">
    ¿No te llegó el código? <a href="#" onclick="return false;" (click)="volver.emit()">Volver a enviarlo</a>
  </div>
</form>
