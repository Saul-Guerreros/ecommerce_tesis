     <main>
        <section class="uk-section uk-section-small">
          <div class="uk-container uk-container-xsmall">
            <div class="uk-text-center">
              <ul class="uk-breadcrumb uk-flex-center uk-margin-remove">
                <li><a href="index.html">Home</a></li>
                <li><span>Verification Code</span></li>
              </ul>
              <h1 class="uk-margin-small-top uk-margin-remove-bottom">Code</h1>
            </div>
            <div class="uk-margin-medium-top">
              <div class="uk-card uk-card-default uk-card-small tm-ignore-container">
                <div class="uk-card-body">
                  <p class="uk-text-meta">Enter the code to reset your password.</p>
                  <form class="uk-form-stacked" action="#" method="post" novalidate="">
                    <div class="uk-grid-medium uk-child-width-1-1" uk-grid=""><div><label><div class="uk-form-label">Code</div><div class="uk-inline uk-width-1-1"><span class="uk-form-icon" uk-icon="icon: check"></span><input
                              class="uk-input"
                              type="text"
                              id="code"
                              [(ngModel)]="code"
                              placeholder="Code: er56756g"
                              autocomplete="one-time-code"
                              required=""
                            /></div></label></div><div>
                                <button class="uk-button uk-button-primary uk-width-1-1" type="submit" (click)="verifiedCode()">Verified Code</button>
                            </div><div class="uk-text-center uk-text-meta">Already have a code? 
                        <a href="verify-code.html">Enter it here</a></div><div class="uk-text-center uk-text-meta">Remembered your password? 
                        <a routerLink="/login">Sign in</a></div></div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
