<main class="tm-auth">
  <div class="uk-container">
    <div class="tm-auth-caja">
      <ul class="uk-breadcrumb uk-flex-center uk-margin-remove">
        <li><a routerLink="/">Inicio</a></li>
        <li><span>Iniciar sesión</span></li>
      </ul>
      <h1 class="tm-auth-titulo">Iniciar sesión</h1>
      <p class="tm-auth-subtitulo">Ingresá a tu cuenta para comprar más rápido.</p>

      <div class="tm-auth-tarjeta">
        <!-- (ngSubmit): también se envía con la tecla Enter -->
        <form (ngSubmit)="login()" novalidate>
          <div class="tm-auth-campo">
            <label class="uk-form-label" for="email">Correo electrónico *</label>
            <div class="uk-inline uk-width-1-1">
              <span class="uk-form-icon" uk-icon="icon: mail"></span>
              <input class="uk-input" id="email" type="email" name="email" inputmode="email"
                     [(ngModel)]="email" placeholder="correo@ejemplo.com" autocomplete="email" required />
            </div>
          </div>

          <div class="tm-auth-campo">
            <label class="uk-form-label" for="password">Contraseña *</label>
            <div class="uk-inline uk-width-1-1">
              <span class="uk-form-icon" uk-icon="icon: lock"></span>
              <input class="uk-input" id="password" type="password" name="password"
                     [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <div class="tm-auth-fila">
            <label class="tm-auth-check" title="Mantener la sesión iniciada durante 30 días en este dispositivo">
              <input class="uk-checkbox" type="checkbox" name="remember" [(ngModel)]="remember" />
              <span>Recordarme</span>
            </label>
            <a class="uk-link-muted" routerLink="/cambiar-credenciales">¿Olvidaste tu contraseña?</a>
          </div>

          <button class="uk-button uk-button-primary uk-width-1-1" type="submit" [disabled]="procesando">
            {{ procesando ? 'Ingresando…' : 'Iniciar sesión' }}
          </button>
        </form>

        <div class="tm-auth-separador">o continuá con</div>
        <div class="tm-auth-google">
          <div #googleBtn></div>
        </div>

        <div class="tm-auth-pie">
          ¿No tenés cuenta? <a routerLink="/register">Registrate</a>
        </div>
      </div>
    </div>
  </div>
</main>
