<main>
        <section class="uk-section uk-section-small">
          <div class="uk-container uk-container-xsmall">
            <div class="uk-text-center">
              <ul class="uk-breadcrumb uk-flex-center uk-margin-remove">
                <li><a routerLink="">Home</a></li>
                <li><span>Iniciar Sesión</span></li>
              </ul>
              <h1 class="uk-margin-small-top uk-margin-remove-bottom">Iniciar Sesión</h1>
            </div>
            <div class="uk-margin-medium-top">
              <div class="uk-card uk-card-default uk-card-small tm-ignore-container">
                <div class="uk-card-body">
                  
                    <div class="uk-grid-medium uk-child-width-1-1" uk-grid=""><div><label><div class="uk-form-label">Correo Electrónico *</div><div class="uk-inline uk-width-1-1"><span class="uk-form-icon" uk-icon="icon: mail"></span><input
                              class="uk-input"
                              id="email"
                              type="email"
                              name="email"
                              [(ngModel)]="email"
                              placeholder="correo@ejemplo.com"
                              autocomplete="email"
                              required=""
                            /></div></label></div><div><label><div class="uk-form-label">Contraseña *</div><div class="uk-inline uk-width-1-1"><span class="uk-form-icon" uk-icon="icon: lock"></span><input
                              class="uk-input"
                              id="tp_password"
                              type="password"
                              name="password"
                              [(ngModel)]="password"
                              placeholder="••••••••"
                              autocomplete="current-password"
                              required=""
                            /></div></label></div><div class="uk-grid-small uk-flex-middle uk-flex-between" uk-grid=""><div class="uk-width-auto"><label><input class="uk-checkbox" type="checkbox" name="remember" [(ngModel)]="remember" />
                            <span class="uk-margin-small-left">Recordarme</span>
                              </label></div><div class="uk-width-auto">
                                <a class="uk-link-muted" routerLink="/cambiar-credenciales">¿Olvidaste tu contraseña?</a>
                              </div></div><div>
                               
								<a href="#" class="uk-button uk-button-primary uk-width-1-1"  onclick="return false;" (click)="login()">Iniciar Sesión</a>
                              </div><div class="uk-flex uk-flex-middle uk-margin-small-top uk-margin-small-bottom">
                                <div class="uk-width-expand uk-text-meta" style="border-bottom:1px solid #e5e5e5;"></div>
                                <span class="uk-margin-small-left uk-margin-small-right uk-text-meta">o</span>
                                <div class="uk-width-expand uk-text-meta" style="border-bottom:1px solid #e5e5e5;"></div>
                              </div><div>
                                <a href="#" class="uk-button uk-button-default uk-width-1-1 uk-flex uk-flex-middle uk-flex-center" onclick="return false;" (click)="loginConGoogle()">
                                  <svg class="uk-margin-small-right" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.3 18.9 12 24 12c3.1 0 5.9 1.1 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                                    <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
                                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                                  </svg>
                                  Iniciar sesión con Google
                                </a>
                              </div><div class="uk-text-center uk-text-meta">¿No tenés cuenta? 
                        <a routerLink="/register">Registrate</a></div></div>
                  
                </div>
              </div>
            </div>
          </div>
        </section>
</main>
