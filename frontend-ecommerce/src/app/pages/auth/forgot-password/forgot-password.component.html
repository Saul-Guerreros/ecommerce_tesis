<main class="tm-auth">
  <div class="uk-container">
    <div class="tm-auth-caja">
      <ul class="uk-breadcrumb uk-flex-center uk-margin-remove">
        <li><a routerLink="/">Inicio</a></li>
        <li><span>Recuperar contraseña</span></li>
      </ul>
      <h1 class="tm-auth-titulo">{{ titulo }}</h1>
      <p class="tm-auth-subtitulo">{{ subtitulo }}</p>

      <div class="tm-auth-pasos" role="img" [attr.aria-label]="'Paso ' + paso + ' de 3'">
        <span class="tm-auth-paso" [class.activo]="paso >= 1"></span>
        <span class="tm-auth-paso" [class.activo]="paso >= 2"></span>
        <span class="tm-auth-paso" [class.activo]="paso >= 3"></span>
      </div>

      <div class="tm-auth-tarjeta">
        @switch (paso) {
          @case (1) {
            <form (ngSubmit)="verifiedMail()" novalidate>
              <div class="tm-auth-campo">
                <label class="uk-form-label" for="email">Correo electrónico *</label>
                <div class="uk-inline uk-width-1-1">
                  <span class="uk-form-icon" uk-icon="icon: mail"></span>
                  <input class="uk-input" id="email" type="email" name="email" inputmode="email"
                         [(ngModel)]="email" placeholder="correo@ejemplo.com" autocomplete="email" required />
                </div>
              </div>
              <button class="uk-button uk-button-primary uk-width-1-1" type="submit" [disabled]="enviando">
                {{ enviando ? 'Enviando…' : 'Enviar código' }}
              </button>
            </form>
          }
          @case (2) {
            <app-code-forgot-password
              (LoadingCodeStatus)="LoadingCode($event)"
              (CodeValue)="CodeValueC($event)"
              (volver)="volverAlInicio()">
            </app-code-forgot-password>
          }
          @case (3) {
            <app-new-password [code]="code"></app-new-password>
          }
        }

        <div class="tm-auth-pie">
          ¿Recordaste tu contraseña? <a routerLink="/login">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>
</main>
