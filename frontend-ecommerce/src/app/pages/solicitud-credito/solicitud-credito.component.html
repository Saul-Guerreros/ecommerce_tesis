<div class="uk-container uk-margin-large-top uk-margin-large-bottom">
  <ul class="uk-breadcrumb">
    <li><a routerLink="/">Inicio</a></li>
    <li><a routerLink="/carrito-de-compra">Carrito</a></li>
    <li><span>Solicitud de Crédito</span></li>
  </ul>

  <h3 class="uk-text-center uk-margin-remove-bottom">Solicitud de Crédito</h3>

  <div class="sc-pasos uk-flex uk-flex-middle uk-flex-center uk-margin-large-bottom uk-margin-small-top">
    <div class="sc-paso" [class.sc-paso--activo]="pasoActual === 'personal'">
      <span>1</span> Datos Personales
    </div>
    <div class="sc-linea"></div>
    <div class="sc-paso" [class.sc-paso--activo]="pasoActual === 'laboral'">
      <span>2</span> Datos Laborales
    </div>
    <div class="sc-linea"></div>
    <div class="sc-paso" [class.sc-paso--activo]="pasoActual === 'referencias'">
      <span>3</span> Referencias
    </div>
    <div class="sc-linea"></div>
    <div class="sc-paso" [class.sc-paso--activo]="pasoActual === 'confirmacion'">
      <span>4</span> Confirmar Solicitud
    </div>
  </div>

  <router-outlet></router-outlet>
</div>
