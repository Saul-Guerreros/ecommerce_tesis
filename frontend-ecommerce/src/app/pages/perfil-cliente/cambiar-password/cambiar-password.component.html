<div class="perfil-card uk-width-1-1 uk-width-1-2@m">
  <h4 class="perfil-card-titulo">Cambiar contraseña</h4>

  <form (submit)="$event.preventDefault(); guardar()">
    <div class="uk-margin">
      <div class="campo-label">Contraseña actual</div>
      <div class="uk-inline uk-width-1-1">
        <span class="uk-form-icon" uk-icon="icon: lock"></span>
        <input class="uk-input perfil-input" type="password" name="password_actual" [(ngModel)]="password_actual" required />
      </div>
    </div>
    <div class="uk-margin">
      <div class="campo-label">Nueva contraseña</div>
      <div class="uk-inline uk-width-1-1">
        <span class="uk-form-icon" uk-icon="icon: lock"></span>
        <input class="uk-input perfil-input" type="password" name="password_nuevo" [(ngModel)]="password_nuevo" required minlength="8" />
      </div>
    </div>
    <div class="uk-margin">
      <div class="campo-label">Confirmar nueva contraseña</div>
      <div class="uk-inline uk-width-1-1">
        <span class="uk-form-icon" uk-icon="icon: lock"></span>
        <input class="uk-input perfil-input" type="password" name="password_nuevo_confirmation" [(ngModel)]="password_nuevo_confirmation" required />
      </div>
    </div>

    <div class="uk-margin-medium-top uk-text-right">
      <button class="uk-button perfil-btn-primario" type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Actualizar' }}
      </button>
    </div>
  </form>
</div>
