@if (visible) {
  <aside class="bandeja" role="region" aria-label="Productos seleccionados para comparar" aria-live="polite">
    <div class="bandeja-items">
      @for (hueco of huecos; track $index) {
        @if (comparador.items[$index]; as item) {
          <div class="bandeja-item" [title]="item.titulo">
            <img [src]="urlImagen(item.imagen)" [alt]="item.titulo" />
            <button type="button" class="bandeja-quitar" (click)="comparador.quitar(item.slug)"
                    [attr.aria-label]="'Quitar ' + item.titulo">×</button>
          </div>
        } @else {
          <div class="bandeja-item bandeja-item--vacio" aria-hidden="true">+</div>
        }
      }
    </div>

    <div class="bandeja-texto">
      <strong>{{ comparador.cantidad }}/{{ huecos.length }} para comparar</strong>
      @if (comparador.cantidad < 2) {
        <span>Elegí al menos 2 productos</span>
      } @else {
        <span>{{ comparador.categoriaActual }}</span>
      }
    </div>

    <div class="bandeja-acciones">
      <button type="button" class="bandeja-vaciar" (click)="comparador.vaciar()">Vaciar</button>
      <button type="button" class="uk-button uk-button-primary uk-button-small"
              [disabled]="comparador.cantidad < 2" (click)="irAComparar()">Comparar</button>
    </div>
  </aside>
}
