<div *ngIf="productos.length > 0" uk-slider="finite: true">
  <div class="uk-grid-small uk-flex-middle uk-margin-bottom" uk-grid="">
    <div class="uk-width-expand">
      <h2 class="uk-margin-remove">{{ titulo }}</h2>
      <p class="uk-text-meta uk-margin-remove" *ngIf="subtitulo">{{ subtitulo }}</p>
    </div>
    <div class="uk-visible@m">
      <a class="tm-slidenav" href="javascript:void(0)" uk-slidenav-previous="" uk-slider-item="previous"></a>
      <a class="tm-slidenav" href="javascript:void(0)" uk-slidenav-next="" uk-slider-item="next"></a>
    </div>
  </div>

  <div class="uk-position-relative">
    <div class="uk-slider-container uk-margin-remove">
      <ul class="uk-slider-items uk-grid tm-vitrina uk-child-width-1-2 uk-child-width-1-3@s uk-child-width-1-4@m uk-grid-medium" uk-grid="">
        <li *ngFor="let producto of productos; trackBy: trackByProducto">
          <app-producto-card [producto]="producto"></app-producto-card>
        </li>
      </ul>
    </div>
  </div>

  <ul class="uk-slider-nav uk-dotnav uk-flex-center uk-margin-medium-top uk-hidden@m"></ul>
</div>
