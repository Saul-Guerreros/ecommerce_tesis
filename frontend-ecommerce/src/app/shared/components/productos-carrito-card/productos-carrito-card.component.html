<div class="uk-card uk-card-default uk-card-body pcc-card">

  <button type="button" class="pcc-header" (click)="toggle()" [attr.aria-expanded]="abierto">
    <span class="uk-card-title uk-margin-remove">Productos en Carrito</span>

    <span class="pcc-header-derecha">
      <span class="pcc-badge">{{ items.length }}</span>
      <span class="pcc-chevron" [class.pcc-chevron--abierto]="abierto"
            uk-icon="icon: chevron-down; ratio: 0.9"></span>
    </span>
  </button>

  <!-- Fondo invisible: clic afuera del panel lo cierra. -->
  <div class="pcc-backdrop" *ngIf="abierto" (click)="cerrar()"></div>

  <!-- Flota encima del contenido siguiente (position: absolute); no
       empuja nada hacia abajo, aunque el carrito tenga muchos productos. -->
  <div class="pcc-panel" *ngIf="abierto">
    <div class="pcc-fila" *ngFor="let item of items">
      <div class="pcc-img-wrap">
        <img *ngIf="muestraImagen(item)" class="pcc-img" [src]="resolverImagen(item.imagen)" [alt]="item.nombre"
             (error)="onImgError(item)">
        <span *ngIf="!muestraImagen(item)" class="pcc-img-fallback" uk-icon="icon: image; ratio: 1.1"></span>
      </div>

      <div class="pcc-info">
        <div class="pcc-nombre">{{ item.nombre }}</div>
        <div class="pcc-cantidad">Cantidad: {{ item.cantidad }}</div>
      </div>

      <div class="pcc-precio">{{ item.total | currency:'PYG':'symbol-narrow':'1.0-0' }}</div>
    </div>

    <p class="uk-text-meta uk-margin-remove" *ngIf="items.length === 0">
      No hay productos para mostrar.
    </p>
  </div>
</div>
